upstream backend_upstream {
    server backend-1:8000 max_fails=3 fail_timeout=10s;
    server backend-2:8000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 30m;

    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        # $http_host, no $host: $host descarta el puerto, y el backend deriva
        # URLs absolutas (logo de marca, docs/122) del header Host que recibe.
        # Con $host, un despliegue en puerto no estandar (localhost:8000)
        # generaba URLs rotas sin puerto.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
