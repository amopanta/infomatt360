<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0A2540"/>
  <!-- M structure (all cyan like brand guide) -->
  <line x1="7" y1="25" x2="7" y2="7" stroke="#00C2FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="25" y1="25" x2="25" y2="7" stroke="#00C2FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="7" y1="7" x2="16" y2="18" stroke="#00C2FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="25" y1="7" x2="16" y2="18" stroke="#00C2FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Cross connections -->
  <line x1="7" y1="14" x2="16" y2="10" stroke="#0066CC" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="25" y1="14" x2="16" y2="10" stroke="#0066CC" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="11" y1="20" x2="21" y2="20" stroke="#0066CC" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <!-- Primary nodes -->
  <circle cx="7" cy="7" r="2.8" fill="#00C2FF"/>
  <circle cx="25" cy="7" r="2.8" fill="#00C2FF"/>
  <circle cx="16" cy="18" r="2.8" fill="#00C2FF"/>
  <!-- Mid nodes -->
  <circle cx="7" cy="14" r="2" fill="#00C2FF" opacity="0.8"/>
  <circle cx="25" cy="14" r="2" fill="#00C2FF" opacity="0.8"/>
  <circle cx="16" cy="10" r="1.8" fill="#0066CC"/>
  <!-- Lower nodes -->
  <circle cx="11" cy="20" r="1.5" fill="#0066CC" opacity="0.7"/>
  <circle cx="21" cy="20" r="1.5" fill="#0066CC" opacity="0.7"/>
  <!-- Bottom nodes -->
  <circle cx="7" cy="25" r="2.2" fill="#00C2FF"/>
  <circle cx="25" cy="25" r="2.2" fill="#00C2FF"/>
  <!-- Detail dots -->
  <circle cx="11" cy="12" r="1" fill="#00C2FF" opacity="0.5"/>
  <circle cx="21" cy="12" r="1" fill="#00C2FF" opacity="0.5"/>
</svg>
