<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!-- InfoMatt "M" Logo - Network nodes concept -->
  <!-- Glow effects (behind everything) -->
  <circle cx="40" cy="45" r="18" fill="#00C2FF" opacity="0.12"/>
  <circle cx="160" cy="45" r="18" fill="#00C2FF" opacity="0.12"/>
  <circle cx="100" cy="130" r="18" fill="#00C2FF" opacity="0.12"/>
  <circle cx="40" cy="190" r="14" fill="#00C2FF" opacity="0.10"/>
  <circle cx="160" cy="190" r="14" fill="#00C2FF" opacity="0.10"/>

  <!-- ── Primary M structure (bright cyan) ── -->
  <!-- Left vertical -->
  <line x1="40" y1="190" x2="40" y2="45" stroke="#00C2FF" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Right vertical -->
  <line x1="160" y1="190" x2="160" y2="45" stroke="#00C2FF" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Left diagonal to center -->
  <line x1="40" y1="45" x2="100" y2="130" stroke="#00C2FF" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Right diagonal to center -->
  <line x1="160" y1="45" x2="100" y2="130" stroke="#00C2FF" stroke-width="5.5" stroke-linecap="round"/>

  <!-- ── Secondary network connections (darker blue) ── -->
  <!-- Left-mid to upper-center -->
  <line x1="40" y1="105" x2="100" y2="75" stroke="#0066CC" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- Right-mid to upper-center -->
  <line x1="160" y1="105" x2="100" y2="75" stroke="#0066CC" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- Lower horizontal connection -->
  <line x1="65" y1="150" x2="135" y2="150" stroke="#0066CC" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Cross diagonals (network mesh) -->
  <line x1="40" y1="150" x2="100" y2="130" stroke="#0066CC" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="160" y1="150" x2="100" y2="130" stroke="#0066CC" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- Upper cross-connections -->
  <line x1="60" y1="70" x2="140" y2="70" stroke="#0066CC" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

  <!-- ── Nodes ── -->
  <!-- Top nodes (large, bright) -->
  <circle cx="40" cy="45" r="11" fill="#00C2FF"/>
  <circle cx="160" cy="45" r="11" fill="#00C2FF"/>
  <!-- Center V node (large, bright) -->
  <circle cx="100" cy="130" r="11" fill="#00C2FF"/>
  <!-- Upper-center node -->
  <circle cx="100" cy="75" r="7" fill="#0066CC"/>
  <!-- Mid vertical nodes -->
  <circle cx="40" cy="105" r="7.5" fill="#00C2FF"/>
  <circle cx="160" cy="105" r="7.5" fill="#00C2FF"/>
  <!-- Lower side nodes -->
  <circle cx="40" cy="150" r="6" fill="#00C2FF" opacity="0.85"/>
  <circle cx="160" cy="150" r="6" fill="#00C2FF" opacity="0.85"/>
  <!-- Lower connection nodes -->
  <circle cx="65" cy="150" r="5" fill="#0066CC"/>
  <circle cx="135" cy="150" r="5" fill="#0066CC"/>
  <!-- Diagonal midpoint nodes (small, network detail) -->
  <circle cx="60" cy="70" r="4" fill="#00C2FF" opacity="0.7"/>
  <circle cx="140" cy="70" r="4" fill="#00C2FF" opacity="0.7"/>
  <circle cx="70" cy="88" r="3.5" fill="#0066CC" opacity="0.7"/>
  <circle cx="130" cy="88" r="3.5" fill="#0066CC" opacity="0.7"/>
  <!-- Bottom nodes -->
  <circle cx="40" cy="190" r="8.5" fill="#00C2FF"/>
  <circle cx="160" cy="190" r="8.5" fill="#00C2FF"/>
  <!-- Tiny accent dots (network scatter) -->
  <circle cx="80" cy="110" r="2.5" fill="#00C2FF" opacity="0.5"/>
  <circle cx="120" cy="110" r="2.5" fill="#00C2FF" opacity="0.5"/>
  <circle cx="100" cy="55" r="2.5" fill="#0066CC" opacity="0.45"/>
</svg>
